
<div class="registro-contenedor">
  <div class="tarjeta registro-tarjeta">

    <div class="registro-logo">🐾💗</div>

    <h1>Crea tu cuenta</h1>

    <p class="registro-descripcion">
      Únete a PeludOS y comienza a cuidar
      a tus mascotas con mucho amor.
    </p>

    <form (ngSubmit)="registrar()">

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nombre_completo"
          placeholder="Escribe tu nombre completo"
          required
        />
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo_electronico"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          [(ngModel)]="telefono"
          placeholder="3001234567"
        />
      </div>

      <div class="campo">
        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          name="direccion"
          [(ngModel)]="direccion"
          placeholder="Escribe tu dirección"
        />
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          name="contrasena"
          [(ngModel)]="contrasena"
          placeholder="Crea una contraseña segura"
          autocomplete="new-password"
          required
        />
      </div>

      @if (mensaje) {
        <p class="mensaje-exito" role="status">
          {{ mensaje }}
        </p>
      }

      @if (error) {
        <p class="mensaje-error" role="alert">
          {{ error }}
        </p>
      }

      <button
        type="submit"
        class="btn btn-primario registro-boton"
        [disabled]="cargando"
      >
        {{ cargando ? 'Creando cuenta...' : 'Crear mi cuenta 💗' }}
      </button>

    </form>

    <p class="registro-login">
      ¿Ya tienes una cuenta?
      <a href="/login">Inicia sesión</a>
    </p>

  </div>
</div>
