
<div class="login-contenedor">
  <div class="tarjeta login-tarjeta">

    <div class="login-logo">🐾💗</div>

    <h1>¡Bienvenido de nuevo!</h1>

    <p class="login-descripcion">
      Inicia sesión en PeludOS y continúa
      cuidando a quienes más amas.
    </p>

    <form (ngSubmit)="iniciarSesion()">

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo_electronico"
          placeholder="ejemplo@correo.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          name="contrasena"
          [(ngModel)]="contrasena"
          placeholder="Escribe tu contraseña"
          autocomplete="current-password"
          required
        />
      </div>

      @if (mensaje) {
        <p class="mensaje-exito" role="status">
          {{ mensaje }}
        </p>
      }

      @if (error) {
        <p class="mensaje-error" role="alert">
          {{ error }}
        </p>
      }

      <button
        type="submit"
        class="btn btn-primario login-boton"
        [disabled]="cargando"
      >
        {{ cargando ? 'Iniciando sesión...' : 'Iniciar sesión 💗' }}
      </button>

    </form>

    <p class="login-registro">
      ¿Todavía no tienes una cuenta?
      <a href="/registro">Regístrate aquí</a>
    </p>

  </div>
</div>
